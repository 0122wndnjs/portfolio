<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>OG Business Card</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }

      body {
        width: 1800px;
        height: 1000px;
        background:
          radial-gradient(ellipse at 14% -6%, rgba(91,77,255,0.10) 0%, transparent 34%),
          radial-gradient(ellipse at 90% 0%, rgba(20,200,235,0.09) 0%, transparent 30%),
          linear-gradient(180deg, #fafaff 0%, #f4f5fb 50%, #edeef8 100%);
        display: flex;
        overflow: hidden;
        position: relative;
      }

      /* iris hairline across the top edge */
      body::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 6px;
        background: linear-gradient(90deg, #5b4dff, #14c8eb, #59f0c0);
        z-index: 2;
      }

      /* faint dot grid — echoes the hero canvas */
      body::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(91,77,255,0.10) 1.5px, transparent 1.5px);
        background-size: 44px 44px;
        pointer-events: none;
        z-index: 0;
      }

      .card {
        position: relative;
        z-index: 1;
        width: 100%;
        display: flex;
      }

      /* ── LEFT ── */
      .left {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 0 120px 0 140px;
        border-right: 1px solid rgba(14,13,31,0.07);
      }

      .name-block { margin-bottom: 20px; }

      .name {
        font-family: "Space Grotesk", "Inter", sans-serif;
        font-size: 104px;
        font-weight: 700;
        letter-spacing: -4px;
        line-height: 0.95;
        color: #0e0d1f;
        display: block;
      }

      .name .outline {
        /* paint-order: fill covers the stroke's inner half, hiding the
           self-overlap artifacts glyph contours leave inside K/M joints */
        color: #f6f7fc;
        -webkit-text-stroke: 5px #0e0d1f;
        paint-order: stroke fill;
      }

      .role {
        font-family: "JetBrains Mono", monospace;
        font-size: 20px;
        font-weight: 400;
        color: rgba(14,13,31,0.4);
        letter-spacing: 0.18em;
        margin-top: 26px;
        text-transform: uppercase;
      }

      .sep {
        display: flex;
        align-items: center;
        gap: 16px;
        margin: 52px 0;
      }

      .sep-line {
        width: 120px;
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, #5b4dff, #14c8eb, #59f0c0);
      }

      .contact {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }

      .contact-item {
        display: flex;
        align-items: center;
        gap: 20px;
      }

      .contact-icon {
        width: 32px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        opacity: 0.9;
      }

      .contact-icon svg { width: 28px; height: 28px; }

      .contact-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 23px;
        font-weight: 400;
        color: rgba(14,13,31,0.55);
        letter-spacing: -0.01em;
      }

      .contact-label .accent { color: #5b4dff; }

      /* ── RIGHT ── */
      .right {
        width: 620px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: rgba(255,255,255,0.4);
        padding: 0 110px;
      }

      .qr-wrap {
        padding: 20px;
        background: #ffffff;
        border-radius: 24px;
        box-shadow: 0 0 0 1px rgba(91,77,255,0.14), 0 32px 64px rgba(45,35,160,0.14);
      }

      .scan-label {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: rgba(14,13,31,0.3);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- LEFT -->
      <div class="left">
        <div class="name-block">
          <span class="name">JOOWON <span class="outline">KIM</span></span>
          <div class="role">Full-Stack Developer & Web3 Builder</div>
        </div>

        <div class="sep">
          <div class="sep-line"></div>
        </div>

        <div class="contact">
          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="2" y="4" width="20" height="16" rx="2" stroke="#5b4dff" stroke-width="1.5"/>
                <path d="M2 7l10 7 10-7" stroke="#5b4dff" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </div>
            <span class="contact-label">0122wndnjs@gmail.com</span>
          </div>

          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" fill="#14c8eb">
                <path d="M9.993 15.23l-.396 5.57c.566 0 .81-.244 1.103-.537l2.644-2.53 5.48 4.01c1.004.554 1.718.263 1.97-.93l3.57-16.73c.297-1.388-.502-1.93-1.49-1.56L1.8 9.72c-1.35.52-1.33 1.27-.23 1.61l5.38 1.68L19.34 5.6c.58-.37 1.11-.17.68.2"/>
              </svg>
            </div>
            <span class="contact-label">@wndnjs0122</span>
          </div>

          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22" stroke="rgba(14,13,31,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
            <span class="contact-label">github.com/0122wndnjs</span>
          </div>

          <div class="contact-item">
            <div class="contact-icon">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="10" stroke="#5b4dff" stroke-width="1.5"/>
                <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" stroke="#5b4dff" stroke-width="1.5"/>
              </svg>
            </div>
            <span class="contact-label">joowonkim<span class="accent">.me</span></span>
          </div>
        </div>
      </div>

      <!-- RIGHT -->
      <div class="right">
        <div class="qr-wrap">
          <div id="qr-container"></div>
        </div>
        <div class="scan-label">SCAN TO VISIT PORTFOLIO</div>
      </div>
    </div>

    <script src="https://unpkg.com/qr-code-styling@1.6.0/lib/qr-code-styling.js"></script>
    <script>
      new QRCodeStyling({
        width: 360, height: 360,
        data: "https://joowonkim.me",
        dotsOptions:          { type: "rounded",       color: "#0e0d1f" },
        backgroundOptions:    { color: "#ffffff" },
        cornersSquareOptions: { type: "extra-rounded", color: "#5b4dff" },
        cornersDotOptions:    { type: "dot",           color: "#5b4dff" },
      }).append(document.getElementById("qr-container"));
    </script>
  </body>
</html>
